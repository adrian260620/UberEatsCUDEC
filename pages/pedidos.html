    <div class="container grey-text">

        <h4 class="center">Pedidos</h4>

        <form id="formPedido" class="formulario">

            <!-- Platillos -->
            <div class="input-field">

                <select id="listaPlatillos">
                    <option value="" disabled selected>
                        Selecciona un platillo
                    </option>
                </select>

                <label for="listaPlatillos">
                    Platillo
                </label>

            </div>

            <!-- Nombre -->
            <div class="input-field">

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required>

                <label for="nombre">
                    Nombre
                </label>

            </div>

            <!-- Dirección -->
            <div class="input-field">

                <textarea
                    id="direccion"
                    name="direccion"
                    class="materialize-textarea"
                    required></textarea>

                <label for="direccion">
                    Dirección
                </label>

            </div>

            <!-- Botones -->
            <div class="botones">

                <button
                    type="reset"
                    class="btn grey">
                    Cancelar
                </button>

                <button
                    type="button"
                    id="btnDireccion"
                    class="btn blue">
                    Obtener ubicación
                </button>

                <button
                    type="submit"
                    id="btnGuardar"
                    class="btn green">
                    Guardar pedido
                </button>

            </div>

            <!-- Mapa -->
            <div id="mapa"></div>

        </form>

    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
